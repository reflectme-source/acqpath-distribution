name: Daily public discovery verification
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: {{CHECKOUT}}
        with:
          persist-credentials: false
      - uses: {{SETUP_NODE}}
        with:
          node-version: '24'
      - run: node scripts/discovery-check.mjs
      - uses: {{UPLOAD}}
        if: always()
        with:
          name: public-discovery-verification
          path: |
            .local/public-audit.json
            .local/discovery-check.json
            .local/docs-verification-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
# Public reads and MCP metadata only. No operator secrets, quote or paid calls.
