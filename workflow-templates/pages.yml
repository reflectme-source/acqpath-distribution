name: Publish integration documentation only
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: distribution-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: {{CHECKOUT}}
        with:
          persist-credentials: false
      - uses: {{SETUP_NODE}}
        with:
          node-version: '24'
      - run: node scripts/verify.mjs
      - run: node scripts/cli.mjs build
      - uses: {{CONFIGURE_PAGES}}
      - uses: {{UPLOAD_PAGES}}
        with:
          path: out/site
      - uses: {{DEPLOY_PAGES}}
        id: deployment
# This publishes only static documentation, not api.getacqpath.com or the original landing.
