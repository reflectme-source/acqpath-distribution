<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="__LOCAL_TOKEN__"><title>AcqPath — one buyer-side purchase</title><style>body{font:16px/1.6 system-ui;max-width:800px;margin:40px auto;padding:24px;background:#f4f7f3;color:#183b2f}input,select,button{display:block;width:100%;padding:12px;margin:8px 0 18px;font:inherit}button{background:#153e30;color:white;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px}.warning{border-left:4px solid #a6642c;padding:18px;background:#fff9e9}</style></head><body><h1>One buyer-side purchase</h1><p class="warning">Real Base USDC. Maximum 0.05 USDC. Use a separate BUYER wallet, not the AcqPath receiving wallet. This is a self-test, not organic revenue and not guaranteed Bazaar indexing. Reconciliation was last reported degraded.</p><label>Real resource on a supported origin<input id="resource" type="url" autocomplete="off" placeholder="https://supported-host/real-resource"></label><label>Purpose<select id="purpose"><option>ai-input</option><option>ai-train</option><option>ai-index</option><option>search</option></select></label><label>Mode<select id="tier"><option value="fresh">Fresh — maximum 0.02 USDC</option><option value="deep">Deep — maximum 0.05 USDC</option></select></label><label>Type BUY ONE REPORT<input id="confirmation" autocomplete="off"></label><button id="buy">Connect buyer wallet and prepare one purchase</button><button id="sign" hidden>Review exact terms and sign in wallet</button><button id="resume">Resume the existing checkpoint — no new signature</button><p id="message"></p><pre id="result">Nothing has been purchased.</pre><script src="/app.js"></script></body></html>
