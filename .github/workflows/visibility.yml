name: Daily public discovery verification
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: node scripts/phase5-monitor.mjs
      - run: node scripts/discovery-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-discovery-verification
          path: |
            .local/phase5/monitor.json
            .local/public-audit.json
            .local/discovery-check.json
            .local/docs-verification-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
# Public reads and MCP metadata only. No operator secrets, quote or paid calls.
