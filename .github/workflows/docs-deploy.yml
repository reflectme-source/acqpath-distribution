name: Reviewed distribution docs deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-docs-main
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: node scripts/verify.mjs
  artifact:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify secret scanner and scan full Git history
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - run: node scripts/cli.mjs build
      - name: Scan and seal the exact static artifact
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner out/site
          node scripts/docs-artifact.mjs seal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-docs-${{ github.sha }}
          path: |
            out/site/
            out/docs-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: artifact
    # Unset by default. Enabling and publishing this workflow require owner approval.
    if: github.repository == 'reflectme-source/acqpath-distribution' && github.ref == 'refs/heads/main' && vars.DOCS_AUTODEPLOY_ENABLED == 'true'
    environment: distribution-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: reviewed-docs-${{ github.sha }}
          path: out
      - run: node scripts/docs-artifact.mjs verify
      - name: Install and audit isolated, pinned distribution tools
        working-directory: tooling/distribution
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Deploy only the verified static Pages artifact
        working-directory: out
        env:
          CLOUDFLARE_ACCOUNT_ID: '449109f33c0c400ea8aef1100c801da6'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node ../tooling/distribution/node_modules/wrangler/bin/wrangler.js pages deploy site --project-name=acqpath-distribution --branch=main --commit-hash="$GITHUB_SHA"
      - name: Verify public bytes, headers, links and 404 on both docs hosts
        run: node scripts/docs-readback.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: docs-readback-${{ github.sha }}
          path: .local/docs-verification-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
